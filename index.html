<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensagem</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2213%22%3E%E2%80%A2%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #ffffff;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #14140f;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 48px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 26px;
    transition: opacity 0.7s cubic-bezier(.22,.61,.36,1), transform 0.7s cubic-bezier(.22,.61,.36,1), filter 0.7s ease;
  }

  .card.leaving {
    opacity: 0;
    transform: translateY(-18px) scale(0.94);
    filter: blur(6px);
  }

  .card.entering {
    opacity: 0;
    transform: translateY(18px) scale(0.94);
    filter: blur(6px);
  }

  .rule {
    width: 28px;
    height: 2px;
    background: #14140f;
    border-radius: 2px;
  }

  .message {
    font-size: clamp(28px, 8vw, 32px);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.35;
  }

  .action-btn {
    border: none;
    background: #2f5fe0;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    padding: 15px 30px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.15s ease, transform 0.15s ease;
    min-height: 54px;
  }
  .action-btn:hover { background: #2953c9; transform: translateY(-1px); }
  .action-btn:active { transform: translateY(0); }

  .loading-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .loading-text {
    font-size: 18px;
    font-weight: 500;
    color: #9a9a90;
    letter-spacing: 0.02em;
  }

  .loading-text .dots {
    display: inline-block;
    width: 1.2em;
    text-align: left;
  }

  .progress-track {
    width: 120px;
    height: 2px;
    background: #e5e5df;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: #2f5fe0;
    border-radius: 2px;
  }

  .choice-row {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .choice-btn {
    border: 1px solid #14140f;
    background: transparent;
    color: #14140f;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 54px;
    max-width: 100%;
  }
  .choice-btn:hover { background: #14140f; color: #ffffff; }
  .choice-btn .line { display: block; white-space: nowrap; }

  .choice-btn.positive {
    border: 1px solid #1f8a3d;
    background: #1f8a3d;
    color: #ffffff;
  }
  .choice-btn.positive:hover { background: #196e31; border-color: #196e31; }

  .choice-btn.warning {
    border: 1px solid #d8a21b;
    background: #f2c84b;
    color: #14140f;
  }
  .choice-btn.warning:hover { background: #d8a21b; border-color: #d8a21b; color: #14140f; }

  .choice-btn.negative {
    border: 1px solid #c73434;
    background: #c73434;
    color: #ffffff;
  }
  .choice-btn.negative:hover { background: #a82929; border-color: #a82929; }

  .thanks {
    font-size: 28px;
    color: #14140f;
    font-weight: 600;
    line-height: 1.35;
  }

  .admin-link {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 10px;
    color: #e3e3dc;
    text-decoration: none;
    user-select: none;
  }

  @media (max-width: 430px) {
    .card { padding: 34px 10px; gap: 22px; }
    .choice-row { flex-direction: column; align-items: stretch; }
    .choice-btn { width: 100%; font-size: 17px; padding: 14px 16px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card" id="card">
    <div class="rule"></div>
    <div class="message">Oi, Daniela</div>
    <button class="action-btn" id="btnStart">Clique aqui</button>
  </div>

  <a class="admin-link" id="adminLink" href="#">·</a>

<script>
  const card = document.getElementById('card');
  const SUPABASE_URL = 'https://oziequrhypzbfdynnnda.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96aWVxdXJoeXB6YmZkeW5ubmRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNTU3OTEsImV4cCI6MjA4OTYzMTc5MX0.dU0_ISLUdDVAh0XQ4wLFlDXf4ZTOuRh__4_mcp0aFxo';
  const INVITE_ID = 'daniela-2026-07';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let loadingDotsInterval = null;

  async function swapTo(renderFn) {
    if (loadingDotsInterval) { clearInterval(loadingDotsInterval); loadingDotsInterval = null; }
    card.classList.add('leaving');
    await wait(650);
    card.innerHTML = '';
    renderFn();
    card.classList.remove('leaving');
    card.classList.add('entering');
    void card.offsetWidth;
    card.classList.remove('entering');
  }

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  function rule() {
    const r = document.createElement('div');
    r.className = 'rule';
    card.appendChild(r);
  }

  function message(text) {
    const m = document.createElement('div');
    m.className = 'message';
    m.textContent = text;
    card.appendChild(m);
  }

  function finalMessage(text) {
    const t = document.createElement('div');
    t.className = 'thanks';
    t.textContent = text;
    card.appendChild(t);
  }

  function setButtonLabel(button, label) {
    if (Array.isArray(label)) {
      label.forEach(line => {
        const span = document.createElement('span');
        span.className = 'line';
        span.textContent = line;
        button.appendChild(span);
      });
    } else {
      button.textContent = label;
    }
  }

  function actionButton(label, onClick) {
    const b = document.createElement('button');
    b.className = 'action-btn';
    setButtonLabel(b, label);
    b.addEventListener('click', onClick, { once: true });
    card.appendChild(b);
  }

  function choiceButton(label, onClick, variant) {
    const b = document.createElement('button');
    b.className = 'choice-btn ' + variant;
    setButtonLabel(b, label);
    b.addEventListener('click', onClick, { once: true });
    return b;
  }

  function choiceRow(choices) {
    const row = document.createElement('div');
    row.className = 'choice-row';
    choices.forEach(c => row.appendChild(choiceButton(c.label, c.onClick, c.variant || '')));
    card.appendChild(row);
  }

  function loadingScreen(text, durationMs) {
    const wrap = document.createElement('div');
    wrap.className = 'loading-wrap';
    wrap.innerHTML =
      '<div class="loading-text">' + text + '<span class="dots"></span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="transition: width ' + durationMs + 'ms linear;"></div></div>';
    card.appendChild(wrap);

    const dotsEl = wrap.querySelector('.dots');
    let step = 0;
    dotsEl.textContent = '.';
    loadingDotsInterval = setInterval(() => {
      step = (step + 1) % 3;
      dotsEl.textContent = '.'.repeat(step + 1);
    }, 400);

    const fill = wrap.querySelector('.progress-fill');
    requestAnimationFrame(() => { fill.style.width = '100%'; });
  }

  function softPauseScreen() {
    loadingScreen('Carregando', 1200);
  }

  async function saveResponse(value) {
    const eventUrl = location.origin + location.pathname + '#' + INVITE_ID + '/' + value;
    try {
      const { error } = await supabaseClient
        .from('personal_dinner_invite_responses')
        .insert({ invite_id: INVITE_ID, response: value, user_agent: navigator.userAgent, page_url: eventUrl });
      if (error) console.error('Falha ao salvar resposta', error);
    } catch (e) {
      console.error('Falha ao salvar resposta', e);
    }
  }

  function trackResponse(value) {
    saveResponse(value);
  }

  document.getElementById('btnStart').addEventListener('click', onFirstClick, { once: true });

  async function onFirstClick() {
    trackResponse('clique_aqui');
    await swapTo(() => { loadingScreen('Carregando', 1200); });
    await wait(1200);
    swapTo(() => {
      rule();
      message('Oi, Daniela');
      actionButton('Clique aqui de novo', onSecondClick);
    });
  }

  async function onSecondClick() {
    trackResponse('clique_aqui_de_novo');
    await swapTo(() => { loadingScreen('Carregando', 1600); });
    await wait(1600);
    swapTo(() => {
      rule();
      message('Oi, Daniela');
      actionButton('Clique uma ultima vez', onThirdClick);
    });
  }

  async function onThirdClick() {
    trackResponse('clique_ultima_vez');
    await swapTo(() => { loadingScreen('Carregando uma última vez', 2000); });
    await wait(2000);
    swapTo(() => {
      rule();
      message('oi ou nada a ver?');
      choiceRow([
        { label: 'KKKK oi', onClick: onOi, variant: 'positive' },
        { label: 'Nada a ver 🤦🏼‍♀️', onClick: onNada, variant: 'negative' }
      ]);
    });
  }

  async function onNada() {
    trackResponse('nada_a_ver');
    swapTo(() => finalMessage('😭'));
  }

  async function onOi() {
    trackResponse('kkkk_oi');
    await swapTo(() => { softPauseScreen(); });
    await wait(1200);
    swapTo(() => {
      rule();
      message('Tenho uma pergunta:');
      choiceRow([
        { label: 'To curiosa, fala', onClick: onCuriosa, variant: 'positive' },
        { label: 'Tchau', onClick: onTchau, variant: 'negative' }
      ]);
    });
  }

  async function onTchau() {
    trackResponse('tchau');
    swapTo(() => finalMessage('😭'));
  }

  async function onCuriosa() {
    trackResponse('to_curiosa_fala');
    await swapTo(() => { softPauseScreen(); });
    await wait(1200);
    swapTo(() => {
      rule();
      message('Vc gosta de flores?');
      choiceRow([
        { label: 'Quem não gosta?', onClick: onFloresSim, variant: 'positive' },
        { label: 'Não, odeio', onClick: onFloresNao, variant: 'negative' }
      ]);
    });
  }

  async function onFloresNao() {
    trackResponse('nao_odeio');
    swapTo(() => finalMessage('quem sabe um dia você mude de ideia 🌹'));
  }

  async function onFloresSim() {
    trackResponse('quem_nao_gosta');
    await swapTo(() => { softPauseScreen(); });
    await wait(1200);
    swapTo(() => {
      rule();
      message('Então eu levo no nosso jantar quando você voltar de viagem?');
      choiceRow([
        { label: 'deal, leva', onClick: onDeal, variant: 'positive' },
        { label: 'kkkkk nice try', onClick: onNiceTry, variant: 'warning' },
        { label: '📸 e 👻, homens 2026', onClick: onHomens, variant: 'negative' }
      ]);
    });
  }

  async function onDeal() {
    trackResponse('deal_leva');
    swapTo(() => finalMessage('combinado 🌹'));
  }

  async function onNiceTry() {
    trackResponse('kkkkk_nice_try');
    swapTo(() => finalMessage('ninguém ganha do homem paciente'));
  }

  async function onHomens() {
    trackResponse('print_ghost_homens_2026');
    swapTo(() => finalMessage('paciência, o não eu já tinha 🤷🏻‍♂️'));
  }

  let clicks = 0, clickTimer = null;
  document.getElementById('adminLink').addEventListener('click', async (e) => {
    e.preventDefault();
    clicks++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { clicks = 0; }, 1200);
    if (clicks >= 5) {
      clicks = 0;
      try {
        const { data, error } = await supabaseClient
          .from('personal_dinner_invite_responses')
          .select('response, created_at')
          .eq('invite_id', INVITE_ID)
          .order('created_at', { ascending: true });
        if (error) throw error;
        const rows = data || [];
        alert(rows.length ? rows.map(r => r.response.toUpperCase() + ' — ' + new Date(r.created_at).toLocaleString('pt-BR')).join('\\n') : 'sem respostas ainda');
      } catch (err) {
        alert('erro ao ler respostas');
      }
    }
  });
</script>

</body>
</html>
